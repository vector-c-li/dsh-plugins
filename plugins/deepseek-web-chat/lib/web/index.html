<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Chat</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="gate" hidden>
      <div class="gate-head">
        <span class="gate-brand">DeepSeek Chat</span>
        <div class="gate-lang" role="group" aria-label="language">
          <button id="gate-lang-zh" class="lang" data-lang="zh">中文</button>
          <button id="gate-lang-en" class="lang" data-lang="en">EN</button>
        </div>
      </div>

      <div class="gate-card">
        <h1 id="gate-title">用 userToken 登录</h1>
        <p id="gate-subtitle" class="gate-sub">不需要密码：按下面四步取一次 userToken，凭证只保存在这台机器上。</p>

        <ol class="gate-steps" id="gate-steps"></ol>

        <button id="gate-browser" class="ghost gate-wide">① 打开 chat.deepseek.com 并登录</button>

        <div class="gate-field">
          <textarea id="gate-token" rows="3" spellcheck="false"></textarea>
        </div>
        <button id="gate-submit" class="primary gate-wide">登录</button>

        <p id="gate-status" class="gate-status"></p>
        <p id="gate-privacy" class="gate-hint"></p>
      </div>
    </div>

    <div id="topbar">
      <div id="account">
        <span class="dot"></span>
        <span class="who" id="account-who">未登录</span>
      </div>
      <div class="spacer"></div>
      <button id="lang-toggle" class="ghost" title="中文 / English">EN</button>
      <button id="new-chat" class="ghost" title="新建对话">新建</button>
      <button id="history" class="ghost" title="历史会话">历史</button>
      <button id="sign-in" class="ghost">登录</button>
      <button id="sign-out" class="ghost" hidden>退出</button>
    </div>

    <div id="transcript"></div>

    <div id="empty" hidden>
      <h1 id="empty-title">DeepSeek Chat</h1>
      <p id="empty-tagline">直接使用 chat.deepseek.com 的对话能力，可附带当前工作区文件作为上下文。</p>
      <p class="hint" id="empty-hint">Enter 发送 · Shift+Enter 换行 · 把文件或会话记录拖进来当上下文</p>
    </div>

    <div id="select-bar" hidden>
      <span id="select-count"></span>
      <div class="spacer"></div>
      <button id="select-insert" class="primary" type="button"></button>
      <button id="select-attach" class="ghost" type="button"></button>
      <button id="select-copy" class="ghost" type="button"></button>
      <button id="select-cancel" class="ghost" type="button"></button>
    </div>

    <div id="composer">
      <div id="chips"></div>
      <div id="input-row">
        <textarea id="input" rows="2" placeholder="先登录 chat.deepseek.com 账号后再提问…"></textarea>
        <button id="send" class="primary" disabled>发送</button>
      </div>
      <div class="row">
        <button id="attach" class="ghost" disabled title="从工作区选择文件">附加文件</button>
        <button id="pick-session" class="ghost" disabled title="把一条 DSH 会话记录加入上下文">会话</button>
        <button id="toggle-thinking" class="toggle" aria-pressed="false">深度思考</button>
        <button id="toggle-search" class="toggle" aria-pressed="false">联网搜索</button>
        <div class="spacer"></div>
        <span class="note" id="note">内容经本机转发到 chat.deepseek.com</span>
      </div>
    </div>

    <div id="drop-overlay">
      <div class="drop-card">
        <strong>松开即可加入上下文</strong>
        <span>工作区文件 / DSH 会话记录</span>
      </div>
    </div>

    <div id="modal-backdrop">
      <div id="modal">
        <header><span id="modal-title"></span></header>
        <div class="body" id="modal-body"></div>
        <div class="foot" id="modal-foot"></div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
