<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-label="Step 3: Local Storage under Application holds the userToken row">
  <rect width="400" height="220" rx="12" fill="#20242c"/>
  <rect x="0" y="0" width="400" height="22" rx="12" fill="#2b303a"/>
  <text x="14" y="15" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#8b93a3">Application</text>

  <rect x="10" y="30" width="140" height="180" rx="8" fill="#262b34"/>
  <text x="20" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#8b93a3">Storage</text>
  <text x="20" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#c9d1e0">▾ Local Storage</text>
  <rect x="14" y="70" width="132" height="16" rx="4" fill="#39404d"/>
  <text x="26" y="81" font-family="Segoe UI, Arial, sans-serif" font-size="7.5" fill="#ffffff">https://chat.deepseek.com</text>
  <text x="20" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#8b93a3">▸ Session Storage</text>
  <text x="20" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#8b93a3">▸ Cookies</text>
  <text x="20" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#8b93a3">▸ IndexedDB</text>

  <rect x="158" y="30" width="232" height="180" rx="8" fill="#262b34"/>
  <rect x="158" y="30" width="232" height="18" rx="8" fill="#2f3540"/>
  <text x="168" y="43" font-family="Segoe UI, Arial, sans-serif" font-size="7.5" fill="#8b93a3">Key</text>
  <text x="238" y="43" font-family="Segoe UI, Arial, sans-serif" font-size="7.5" fill="#8b93a3">Value</text>
  <text x="168" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="7.5" fill="#c9d1e0">locale</text>
  <text x="238" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="7.5" fill="#7c8699">zh_CN</text>
  <rect x="162" y="72" width="224" height="18" rx="4" fill="#2f4fd8" opacity="0.32"/>
  <rect x="162" y="72" width="3" height="18" rx="1.5" fill="#7b93ff"/>
  <text x="168" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#ffffff" font-weight="600">userToken</text>
  <text x="238" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="7.5" fill="#c7d2ff">x7Qm2Rb9Lk4Tp8Nv…</text>
  <text x="168" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="7.5" fill="#c9d1e0">theme</text>
  <text x="238" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="7.5" fill="#7c8699">dark</text>

  <rect x="226" y="120" width="150" height="26" rx="7" fill="#11141a" stroke="#7b93ff"/>
  <text x="236" y="131" font-family="Segoe UI, Arial, sans-serif" font-size="7.5" fill="#c7d2ff">双击右侧 Value，或右键</text>
  <text x="236" y="141" font-family="Segoe UI, Arial, sans-serif" font-size="7.5" fill="#c7d2ff">→ Copy value，然后粘贴</text>
