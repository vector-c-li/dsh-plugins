# Bundle layer of dsh-deepseek-web-chat.
#
# A bundle patch is one insert over the profile root: the row below mounts the
# Host half, which serves the panel at /deepseek-web/ and stores the web account
# token in the credentials store. The browser half is discovered from
# `dsh.client` in package.json, so it needs no row of its own.
#
# Disable the panel by setting `disabled: true` on this row in your profile's
# cordis.patch.yml.
- insert:
    - id: deepseek-web-chat
      name: 'dsh-deepseek-web-chat'
      config:
        locale: zh_CN
